[package]
name = "twine-test-platform"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "twine-test-platform"
path = "main.rs"
test = false
bench = false

[dependencies]
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "b2eb37e2af134e4bb4248df454c437b06c1f93c0" }
kernel = { git = "https://github.com/shuyra-arche/kernel.git", rev = "b2eb37e2af134e4bb4248df454c437b06c1f93c0" }
spin = { version = "0.10", default-features = false, features = ["once"] }
fdt = { version = "0.1.5", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
